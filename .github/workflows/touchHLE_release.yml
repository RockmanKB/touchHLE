# Simplified build: Windows only, builds the code in THIS repository (fork).
name: Build touchHLE for Windows (Double Dragon fixes)

on:
  push:
    branches: [ "trunk" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-win:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Unpack Double Dragon files
      shell: bash
      run: if [ -f dd_patch.zip ]; then 7z x -y dd_patch.zip; fi
    - name: Download Boost
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"
    - name: Extract Boost
      run: 7z -ovendor x boost_1_81_0.7z && ren vendor\boost_1_81_0 boost
    - name: Download CMake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"
    - name: Extract CMake
      run: 7z -ovendor x "cmake-3.31.6-windows-x86_64.zip" && ren vendor\cmake-3.31.6-windows-x86_64 cmake
    - name: Build
      run: cargo build --release
      env:
        CMAKE: ${{ github.workspace }}\vendor\cmake\bin\cmake
    - name: Create bundle
      shell: bash
      run: cd dev-scripts && ./make-windows-bundle.sh ../target/release/touchHLE.exe && mv touchHLE_windows_bundle/ ..
    - name: Build the Double Dragon app
      run: cargo build --release --manifest-path dd_launcher/Cargo.toml
    - name: Assemble the Double Dragon app folder
      shell: bash
      run: |
        D="DoubleDragon_App/Double Dragon"
        mkdir -p "$D/engine" "$D/game" "$D/config" "$D/saves/player1" "$D/saves/player2"
        cp dd_launcher/target/release/DoubleDragon.exe "$D/Double Dragon.exe"
        cp -r touchHLE_windows_bundle/* "$D/engine/"
        printf 'Put DoubleDragon.ipa in this folder.\r\n' > "$D/game/PUT DoubleDragon.ipa HERE.txt"
        cp dd_launcher/README.txt "$D/README.txt"
    - uses: actions/upload-artifact@v4
      with:
        name: DoubleDragon_App
        path: DoubleDragon_App/
    - uses: actions/upload-artifact@v4
      with:
        name: touchHLE_Windows_DoubleDragon
        path: touchHLE_windows_bundle/
